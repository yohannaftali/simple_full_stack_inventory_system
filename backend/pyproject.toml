[project]
name = "sfsis-backend"
version = "0.1.0"
description = ""
requires-python = ">=3.13"
authors = [
    { name = "Yohan Naftali", email = "yohan_naftali@ptsenopati.com" }
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pymysql>=1.1",
  "bcrypt>=4.1",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "odfpy>=1.4",
  "reportlab>=4.2",
  # zoneinfo's own stdlib fallback for when the host has no system tzdata
  # (issue #47) - the base python:3.13-slim image happens to have
  # /usr/share/zoneinfo today (pulled in transitively), but that's not
  # guaranteed across base images/hosts, so pin the real thing explicitly
  # rather than depend on it staying true by accident.
  "tzdata>=2024.1",
]
