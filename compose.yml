# Run on local development environment
# podman compose -f compose.yml up -d

services:
  database:
    container_name: sfsis-mariadb
    build:
      context: .
      dockerfile: database/Dockerfile
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      # Complementary safety net only (issue #47) - the app itself no longer
      # relies on the DB container's clock/timezone for created_at/updated_at
      # (see backend's core/timezone.py), but pinning this explicitly avoids
      # ever depending on whatever timezone the host machine happens to be in.
      TZ: ${TZ:-UTC}
    ports:
      - "3306:3306"
    volumes:
      - ./database:/var/lib/mysql
      - ./logs/database:/var/log/mysql:rw
    healthcheck:
      # The image's own healthcheck.sh assumes unix-socket auth for
      # root@localhost, but this compose file gives root a real password
      # (MARIADB_ROOT_PASSWORD) instead - healthcheck.sh's socket-protocol
      # queries get "Access denied" and it never reports healthy. Ping
      # directly with those same credentials instead.
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  backend:
    container_name: sfsis-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      JWT_SECRET: ${JWT_SECRET}
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: ${UVICORN_PORT}
      UVICORN_PORT_SSL: ${UVICORN_PORT_SSL}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      DATABASE_HOST: database
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET}
      # Boot-time default only (issue #47) - seeds app_configs.timezone on a
      # fresh install; the live, admin-editable value afterwards lives in
      # that row (Application Config screen), not this env var.
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
    ports:
      - "${UVICORN_PORT}:${UVICORN_PORT}"
      - "${UVICORN_PORT_SSL}:${UVICORN_PORT_SSL}"
    volumes:
      - ./backend:/usr/src/app
      # Anonymous volume shadowing .venv inside the bind mount: the
      # container keeps its own Linux-layout virtualenv, never seeing (or
      # clobbering) a Windows-layout .venv on the host - a host `uv sync`
      # and the container's entrypoint `uv run` used to fight over the
      # same directory, crash-looping the container with
      # "Input/output error (os error 5)".
      - /usr/src/app/.venv
      - ./logs/backend:/usr/src/app/logs:rw
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # Plain HTTP root ("/") needs no auth/cookies and returns
      # {"status": "ok"} once alembic has finished and uvicorn is serving -
      # python3/urllib is stdlib, so no extra package install needed just
      # for the healthcheck.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${UVICORN_PORT}/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  frontend:
    container_name: sfsis-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: always
    environment:
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: ${FRONTEND_PORT}
      FRONTEND_PORT_SSL: ${FRONTEND_PORT_SSL}
      FRONTEND_DEFAULT_SERVER_URL: ${FRONTEND_DEFAULT_SERVER_URL:-http://backend:5000}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
      - "${FRONTEND_PORT_SSL}:${FRONTEND_PORT_SSL}"
    volumes:
      - ./frontend:/usr/src/app
      # Same .venv isolation as the backend service above.
      - /usr/src/app/.venv
      - ./logs/frontend:/usr/src/app/logs:rw
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${FRONTEND_PORT}/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  nginx:
    container_name: sfsis-nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: always
    environment:
      NGINX_EXPOSED_FRONTEND_PORT: ${NGINX_EXPOSED_FRONTEND_PORT}
      NGINX_EXPOSED_FRONTEND_PORT_SSL: ${NGINX_EXPOSED_FRONTEND_PORT_SSL}
      NGINX_EXPOSED_BACKEND_PORT: ${NGINX_EXPOSED_BACKEND_PORT}
      NGINX_EXPOSED_BACKEND_PORT_SSL: ${NGINX_EXPOSED_BACKEND_PORT_SSL}
      FRONTEND_PORT: ${FRONTEND_PORT}
      FRONTEND_PORT_SSL: ${FRONTEND_PORT_SSL}
      UVICORN_PORT: ${UVICORN_PORT}
      UVICORN_PORT_SSL: ${UVICORN_PORT_SSL}
    ports:
      - "${NGINX_EXPOSED_FRONTEND_PORT}:${NGINX_EXPOSED_FRONTEND_PORT}"
      - "${NGINX_EXPOSED_FRONTEND_PORT_SSL}:${NGINX_EXPOSED_FRONTEND_PORT_SSL}"
      - "${NGINX_EXPOSED_BACKEND_PORT}:${NGINX_EXPOSED_BACKEND_PORT}"
      - "${NGINX_EXPOSED_BACKEND_PORT_SSL}:${NGINX_EXPOSED_BACKEND_PORT_SSL}"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      # nginx:alpine has no python3, but does carry busybox's wget - hits
      # nginx's own plain-HTTP frontend passthrough, which only reports
      # healthy once nginx itself is actually up and its config is valid.
      # Must target 127.0.0.1, not localhost - confirmed live that wget
      # resolves "localhost" to ::1 first inside this image and nginx
      # isn't listening on IPv6, so every healthcheck attempt failed with
      # "Connection refused" despite nginx itself running and serving
      # traffic correctly on IPv4.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:${NGINX_EXPOSED_FRONTEND_PORT}/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s