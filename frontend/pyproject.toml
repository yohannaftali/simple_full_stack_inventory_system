[project]
name = "sfsis"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Yohan Naftali", email = "yohan_naftali@ptsenopati.com" }
]
dependencies = [
  # NOTE: must stay bare "flet", NOT "flet[all]" - the [all] extra pulls in
  # flet-cli (needs watchdog>=4.0.0, no Android/iOS wheel exists) and
  # flet-web/flet-desktop, none of which belong on a mobile device. This is
  # what `flet build apk`/`ipa` actually bundles onto the target (read via
  # [project.dependencies], see flet_cli/commands/build_base.py). The full
  # `flet[all]==0.86.4` toolchain for local dev (flet run, flet build, etc.)
  # is already declared separately below in [dependency-groups].dev - do not
  # duplicate it here.
  # Issue #68: upgraded 0.85.3 -> 0.86.4. flet-datatable2 pinned exactly
  # (its own requires_dist is `flet==0.86.4`, confirmed on PyPI before
  # starting this upgrade) - both must move in lockstep or uv's resolver
  # rejects the pair.
  "flet==0.86.4",
  "flet-datatable2==0.86.4",
  # Live in-browser camera scan (issue #64 v1.5) - a genuine Flutter
  # `camera` plugin wrapper (Web/iOS/Android support), unblocked by the
  # flet==0.86.4 upgrade (its stable releases only ever matched 0.86.4,
  # never 0.85.3 - see components/scan_input.py). Runtime camera
  # permission on native Android/iOS goes through flet-permission-handler;
  # a browser's own getUserMedia permission prompt covers the web
  # deployment without it, but it's cheap to include for the native path.
  "flet-camera==0.86.4",
  "flet-permission-handler==0.86.4",
  "requests>=2.31.0",
  "websockets>=15.0",
  "openpyxl>=3.1.2",
  # pages/modals/totp/index.py renders the 2FA enrollment QR via
  # qrcode.image.pure.PyPNGImage (deliberately Pillow-free, matching this
  # list's own lean-mobile-footprint philosophy above) - that image
  # backend needs the optional `pypng` package, and `qrcode` itself was
  # never actually declared here (issue #58) even though it ended up in
  # uv.lock anyway as an incidental transitive resolution.
  "qrcode>=8.2",
  "pypng>=0.20220715.0",
  # Camera/photo-based barcode/QR decode (issue #64) - components/scan_input.py's
  # "Scan with Photo" fallback path. pyzbar wraps the native libzbar shared
  # library (installed separately in frontend/Dockerfile, see the comment
  # there) via ctypes - it decodes raw image bytes handed to Python by
  # ft.FilePicker(file_type=IMAGE, with_data=True), it does not touch a
  # camera device itself (this app's containerized web deployment runs the
  # Flet process server-side - only bytes already delivered to Python are
  # ever usable here, see AGENTS.md's "Container networking gotcha").
  "pyzbar>=0.1.9",
  "pillow>=10.0.0",
]

[tool.flet]
# org name in reverse domain name notation, e.g. "com.mycompany".
# Combined with project.name to build bundle ID for iOS and Android apps
org = "com.ptsenopati"

# project display name that is used as an app title on Android and iOS home screens,
# shown in window titles and about app dialogs on desktop.
product = "SFSIS"

# company name to display in about app dialogs
company = "Senopati"

# copyright text to display in about app dialogs
copyright = "Copyright (C) 2025 by Senopati"

[tool.flet.app]
path = "src"

[tool.flet.android]
min_sdk_version = 33

[tool.flet.android.signing]
# key_store is deliberately NOT set here, even though it isn't secret -
# confirmed live (real `flet build apk` run) that flet-cli's generated
# Gradle project resolves a relative `key_store` path against the
# Flutter scaffold's OWN app module directory
# (build/flutter/android/app/), not this project directory - a value
# like "key/upload-keystore.jks" here fails with Gradle's
# `validateSigningRelease` reporting a keystore that "doesn't exist" at
# build/flutter/android/app/key/upload-keystore.jks, which is never
# where the real file lives. run.ps1/run.sh instead export
# FLET_ANDROID_SIGNING_KEY_STORE as an ABSOLUTE path to
# frontend/key/upload-keystore.jks before every apk/aab build (see
# Set-AndroidSigningEnv/set_android_signing_env) - computed fresh at
# build time, so it's correct regardless of where the generated Flutter
# scaffold happens to resolve a relative path from.
#
# The actual store/key passwords are NEVER put here either - `flet
# build` reads those from the FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD /
# FLET_ANDROID_SIGNING_KEY_PASSWORD env vars (see .env, gitignored),
# which run.ps1/run.sh also load from the repo-root .env before invoking
# a build. Generate the keystore itself via run.ps1/run.sh's "Generate
# Android upload keystore" option - it's gitignored (frontend/key/),
# never commit the .jks file itself.
key_alias = "upload"

[tool.flet.android.permission]
# Required by flet-camera's live in-app/in-browser scan (issue #64) and
# flet-permission-handler's runtime request. No storage permission is
# needed: the "Scan with Photo" fallback uses ft.FilePicker(file_type=IMAGE),
# which on Android launches the system Photo Picker - not gated by
# READ_MEDIA_IMAGES/READ_EXTERNAL_STORAGE - and nothing here writes to
# shared storage.
"android.permission.CAMERA" = true

[dependency-groups]
dev = [
    "flet[all]==0.86.4",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
flet = {extras = ["all"], version = "0.86.4"}

[tool.ruff]
# Target your exact Python version
target-version = "py310"
exclude = [
    ".git",
    "data",
]
src = ["src"]

[tool.ruff.lint]
# E, F are default rules (Errors and Pyflakes)
# PL introduces Pylint-specific checks that actually work without choking on Flet
select = ["E", "F", "PL"]

# Replaces your [MESSAGES CONTROL] disable list
ignore = [
    "E501",    # line-too-long
    "C901",    # too-many-statements / complex structure
    "D101",    # missing-class-docstring
    "D100",    # missing-module-docstring
    "D103",    # missing-function-docstring
    "ARG001",  # unused-argument
    "F841",    # unused-variable
    "N816",    # invalid-name (mixedCase variables, etc.)
    "PLR0913", # too-many-arguments
    "PLR0914", # too-many-locals
    "PLR0915", # too-many-statements
    "PLR0912", # too-many-branches
    "BLE001",  # broad-exception-caught
]

# Replaces [TYPECHECK] ignored-modules=MetaTrader5
# Ruff ignores dynamic attributes by default, but this stops it from flag-checking it
[tool.ruff.lint.pep8-naming]
ignore-names = ["MetaTrader5"]
